name: Generate Talkmap

"on":
  push:
    branches:
      - master
    paths:
      - '_talks/**'
      - 'talkmap.py'
  workflow_dispatch:

jobs:
  generate-talkmap:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install python-frontmatter geopy getorg

      - name: Run talkmap.py
        run: |
          python talkmap.py

      - name: Commit and push generated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add talkmap/
          git diff --cached --quiet || git commit -m "Auto-update talkmap [skip ci]"
          git push
