# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Jiancheng An | UESTC"  # 优化：增强浏览器标签页的辨识度与SEO
title_separator          : "|"
name                     : "Jiancheng An"
description              : "Dr. Jiancheng An is a Professor at UESTC, specializing in Stacked Intelligent Metasurfaces (SIM), Flexible Intelligent Metasurfaces (FIM), and Electromagnetic Neural Networks (EMNN)." # 优化：规范学术头衔与关键词，利于Google收录
url                      : "https://jiancheng-an.github.io" 
baseurl                  : "" 
repository               : "jiancheng-an/jiancheng-an.github.io"

# Site Author
author:
  # Biographic information
  avatar           : "JianchengAn.jpg"
  name             : "Jiancheng An"
  pronouns         : "he/him"  # 补充：规范海外学术界常用的代词
  bio              : "Professor, School of Electronic Science and Engineering, UESTC" # 优化：加入学校简称，提升辨识度
  location         : "Chengdu, China"
  employer         : "University of Electronic Science and Technology of China (UESTC)" # 优化：使用学校全称
  uri              : "https://jiancheng-an.github.io/"
  email            : "jiancheng.an@uestc.edu.cn" 

  # Academic websites
  academia         : # URL
  arxiv            : # URL
  googlescholar    : "https://scholar.google.com/citations?user=-iLYPnkAAAAJ&hl=en&authuser=2"
  impactstory      : # URL
  orcid            : "https://orcid.org/0000-0003-2512-9989"
  semantic         : # URL
  pubmed           : # URL
  researchgate     : "https://www.researchgate.net/profile/Jiancheng-An-2?ev=hdr_xprf"
  scopus           : # URL

  # Repositories and software development
  bitbucket        : # Username
  codepen          : # Username
  dribbble         : # Username
  github           : "jiancheng-an"
  kaggle           : # Username  
  stackoverflow    : # User number 

  # Social media
  bluesky          : # URL
  facebook         : # Username
  flickr           : # Username
  foursquare       : # Username
  goodreads        : # Username
  google_plus      : # Username
  keybase          : # Username
  instagram        : # Username
  lastfm           : # Username
  linkedin         : "jiancheng-an-955564246"
  mastodon         : # URL
  medium           : # URL
  pinterest        : # Username
  soundcloud       : # Username
  steam            : # Username
  telegram         : # URL
  tumblr           : # Username
  twitter          : # Username
  vine             : # Username
  weibo            : # Username
  wikipedia        : # Username
  xing             : # Username
  youtube          : # Username
  zhihu            : # Username
  bilibili         : "26360998?spm_id_from=333.1007.0.0"
  weixin           : # Username
  
# Publication Category
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs              : true # 建议：开启面包屑导航，方便访问者在你复杂的学术论文/教学页面间切换
words_per_minute         : 160
future                   : true
read_more                : "disabled" 
talkmap_link             : true
comments:
  provider               : false # 优化：显式关闭评论，避免生成多余的空白DOM，需要时可改为 "disqus"
  disqus:
    shortname            :
  discourse:
    server               : 
  facebook:
    appid                :
    num_posts            : 
    colorscheme          : 
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" 
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" 
atom_feed:
  hide                   : true     
  path                   : 


# SEO Related (建议：去对应的站长平台获取验证码填入，有利于Google等检索你的论文主页)
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing (优化：绑定学术推特/X，方便别人一键分享你的论文)
twitter:
  username               : 
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "JianchengAn.jpg" # 优化：设置默认分享卡片图，当别人在Twitter/LinkedIn分享你主页时，会弹出你的头像
social:
  type                   : "Person" # 优化：显式声明为个人，对Google的结构化数据（Schema）更友好
  name                   : "Jiancheng An"
  links: 
    - https://scholar.google.com/citations?user=-iLYPnkAAAAJ&hl=en&authuser=2
    - https://orcid.org/0000-0003-2512-9989
    - https://www.linkedin.com/in/jiancheng-an-955564246


# Analytics (建议：若有流量分析需求，可开通 Google Analytics 4 并在此填入)
analytics:
  provider               : "false" 
  google:
    tracking_id          :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections Settings
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/


# Defaults Defaults for Layouts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed 


# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC 


# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/


# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
